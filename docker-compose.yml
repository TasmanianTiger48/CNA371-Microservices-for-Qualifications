services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qualification-service:
    image: ryandewet577645/qualification-service:${TAG:-latest}
    build: ./services/QualificationService
    ports:
      - "5054:8080"

  assessment-service:
    image: ryandewet577645/assessment-service:${TAG:-latest}
    build: ./services/AssessmentService
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Redis: redis:6379
      Services__QualificationService: http://qualification-service:8080
    depends_on:
      - redis
      - qualification-service

  qualification-interface:
    image: ryandewet577645/qualification-interface:${TAG:-latest}
    build: ./clients/QualificationInterface
    stdin_open: true
    tty: true
    restart: unless-stopped
    env_file: ./clients/QualificationInterface/.env
    depends_on:
      - assessment-service
