services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qualification-service:
    build: ./services/QualificationService
    ports:
      - "5054:8080"

  assessment-service:
    build: ./services/AssessmentService
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Redis: redis:6379
      Services__QualificationService: http://qualification-service:8080
    depends_on:
      - redis
      - qualification-service
